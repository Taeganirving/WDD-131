<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a student or guest ticket for an upcoming event.">
  <title>Event Ticket</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="event.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>
    <form id="ticketForm" novalidate>
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" autocomplete="family-name" required>
      </div>
      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="ticketType">Type</label>
        <select id="ticketType" name="ticketType" aria-controls="credentialField" required>
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>
      <div class="field">
        <label for="eventDate">Event Date</label>
        <input id="eventDate" name="eventDate" type="date" required>
      </div>
      <div id="credentialField" class="field full" hidden>
        <label id="credentialLabel" for="credential">Student I#</label>
        <input id="credential" name="credential" type="text" aria-describedby="credentialHint" disabled>
        <small id="credentialHint"></small>
      </div>
      <button class="full" type="submit">Create Ticket</button>
    </form>
    <section id="output" aria-live="polite" aria-atomic="true" tabindex="-1"></section>
  </main>
</body>
</html>
