<!DOCTYPE html>

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <h1>Kids Read For Fun</h1>
    <nav aria-label="Main navigation">
      <ul class="main-nav">
        <!-- Inactive placeholders until these pages exist; no empty fragment jumps. -->
        <li><a role="link" aria-disabled="true">About</a></li>

        <p class="review-date"><time datetime="2022-07-05">July 5, 2022</time></p>

        <h2 id="book-title-1">Septimus Heap Book One: Magyk</h2>

        <p>If you enjoy stories about seventh sons of seventh sons and magyk this is the book for you.</p>
